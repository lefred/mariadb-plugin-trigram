name: Build and package TRIGRAM plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: trigram
      plugin_directory: trigram
      build_target: trigram
      plugin_library: trigram.so

      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_TRIGRAM=DYNAMIC
      test_suite: trigram
      run_tests: false
