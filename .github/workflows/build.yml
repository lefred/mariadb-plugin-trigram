name: Build and package TRIGRAM plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: trigram
      plugin_directory: trigram
      build_target: trigram
      plugin_library: trigram.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: trigram
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
